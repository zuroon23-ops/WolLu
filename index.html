
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WolLu — 보드게임 라운지</title>

  <style>
    /* V1.4.2: 데스크톱 90% 밀도, 모바일 기존 크기 유지 */
    :root {
      --ui-scale: .9;
    }

    @media (max-width: 700px) {
      :root {
        --ui-scale: 1;
      }
    }

    /* ===== 공통 스타일 ===== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #121e1b;
      color: #eff2e9;
      font: calc(16px * var(--ui-scale)) system-ui, sans-serif;
    }

    main {
      max-width: calc(900px * var(--ui-scale));
      margin: auto;
      padding: calc(40px * var(--ui-scale)) calc(24px * var(--ui-scale));
    }

    h1 {
      font-size: clamp(
        calc(40px * var(--ui-scale)),
        8vw,
        calc(76px * var(--ui-scale))
      );
      letter-spacing: .1em;
      margin: 0;
      color: #f4d79e;
    }

    h2 {
      font-size: calc(20px * var(--ui-scale));
    }

    p {
      color: #bbc9c0;
      line-height: 1.6;
    }

    /* ===== 브랜드 헤더 ===== */

    header {
      text-align: center;
      border-bottom: 1px solid #374740;
      padding-bottom: calc(28px * var(--ui-scale));
      margin-bottom: calc(32px * var(--ui-scale));
    }

    .brandLogo {
      width: min(calc(460px * var(--ui-scale)), 100%);
      display: block;
      margin: auto;
    }

    header p {
      margin: calc(12px * var(--ui-scale)) 0;
    }

    .slogan {
      border-top: 1px solid #374740;
      padding-top: calc(16px * var(--ui-scale));
      font-size: calc(14px * var(--ui-scale));
    }

    /* ===== 게임 카드 레이아웃 ===== */

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(calc(230px * var(--ui-scale)), 1fr)
      );
      gap: calc(16px * var(--ui-scale));
    }

    .card {
      display: block;
      border: 1px solid #40544a;
      border-radius: calc(16px * var(--ui-scale));
      background: #1b2b25;
      padding: calc(24px * var(--ui-scale));
      color: inherit;
      text-decoration: none;
    }

    .card:hover {
      border-color: #f4d79e;
    }

    .card h3 {
      font-size: calc(23px * var(--ui-scale));
      margin: calc(14px * var(--ui-scale)) 0 0;
    }

    .tag {
      font-size: calc(12px * var(--ui-scale));
      color: #86cfa9;
    }

    .future {
      border-style: dashed;
      display: flex;
      justify-content: center;
      flex-direction: column;
    }

    /* ===== 오목 카드 미리보기 ===== */

    .board {
      aspect-ratio: 2 / 1;
      background-color: #dcb77d;
      background-image:
        linear-gradient(#86643a 1px, transparent 1px),
        linear-gradient(90deg, #86643a 1px, transparent 1px);
      background-size:
        calc(24px * var(--ui-scale)) calc(24px * var(--ui-scale));
      border-radius: calc(10px * var(--ui-scale));
      display: flex;
      align-items: center;
      justify-content: center;
      gap: calc(7px * var(--ui-scale));
    }

    .stone {
      height: calc(28px * var(--ui-scale));
      width: calc(28px * var(--ui-scale));
      border-radius: 50%;
      background: #252525;
      box-shadow:
        0
        calc(3px * var(--ui-scale))
        calc(4px * var(--ui-scale))
        #0004;
    }

    .white {
      background: #fff9ee;
    }

    /* ===== 푸터 ===== */

    footer {
      display: flex;
      justify-content: space-between;
      font-size: calc(13px * var(--ui-scale));
      color: #98aaa0;
      margin-top: calc(40px * var(--ui-scale));
    }

    /* ===== 벽돌깨기 미리보기 ===== */
    .breakerPreview {
      position: relative;
      background: #142c25;
      background-image: none;
      overflow: hidden;
    }
    .breakerPreview .brick {
      display: grid;
      place-items: center;
      width: 23%;
      height: 38%;
      background: #527b65;
      border: 2px solid #83b599;
      border-radius: 8px;
      font-weight: 750;
      color: #f6e9c7;
    }
    .breakerPreview .brick:nth-child(2) { background: #a37d4a; border-color: #d5b478; }
    .breakerPreview .brick:nth-child(3) { background: #735c8d; border-color: #ac8bcd; }
    .breakerPreview .breakerBall {
      position: absolute;
      left: 44%;
      bottom: 9%;
      color: #ffbd68;
      font-size: 34px;
      text-shadow: 0 0 12px #ffb54b;
    }

    /* ===== 키보드 접근성 ===== */

    a:focus-visible {
      outline: calc(3px * var(--ui-scale)) solid #f4d79e;
      outline-offset: calc(4px * var(--ui-scale));
    }
  </style>
</head>

<body>
  <main>

    <!-- ===== 브랜드 헤더 ===== -->
    <header>
      <h1>
        <img
          class="brandLogo"
          src="wollu-logo.svg"
          alt="ONLINE BOARD GAME LOUNGE · WolLu"
        >
      </h1>

      <p>일하기 싫은 직장인들의 온라인 보드게임 라운지</p>
      <p class="slogan">일하는 척, 놀이는 진심.</p>
    </header>

    <!-- ===== 게임 선택 ===== -->
    <h2>게임 선택</h2>

    <div class="grid">

      <!-- 오목 -->
      <a class="card" href="omok/">
        <div class="board" aria-hidden="true">
          <span class="stone"></span>
          <span class="stone white"></span>
          <span class="stone"></span>
          <span class="stone white"></span>
        </div>

        <h3>오목</h3>
        <p>15 × 15 · 2인 대전</p>
        <p class="tag">실시간 멀티플레이</p>
        <span class="tag">게임 입장 →</span>
      </a>

      <!-- 벽돌깨기 -->
      <a class="card" href="breaker/">
        <div class="board breakerPreview" aria-hidden="true">
          <span class="brick">18</span>
          <span class="brick">24</span>
          <span class="brick">35</span>
          <span class="breakerBall">✹</span>
        </div>
        <h3>벽돌깨기</h3>
        <p>공을 뽑고 합성해 끝없이 도전하세요.</p>
        <p class="tag">싱글플레이 · 온라인 랭킹</p>
        <span class="tag">게임 입장 →</span>
      </a>

    </div>

    <!-- ===== 푸터 ===== -->
    <footer>
      WolLu · 온라인 보드게임 라운지
      <span>Ver. 1.4.2</span>
    </footer>

  </main>
</body>
</html>
