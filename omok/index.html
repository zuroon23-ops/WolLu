<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>오목 · 한 판</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#252820;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:32px;margin:0}h2{font-size:16px;margin:0 0 10px}.sub{color:#666;margin:6px 0 22px}.panel{background:white;border:1px solid #e3dfd5;border-radius:16px;padding:16px;margin-bottom:14px}button,input{font:inherit;border-radius:9px;padding:11px 13px;border:1px solid #d5d3ca;min-width:0}button{background:#325a47;color:#fff;border:0;cursor:pointer;font-weight:600}button.secondary{background:#eaece6;color:#283d30}button:disabled{opacity:.45;cursor:default}input{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:110px}.players{display:flex;justify-content:space-between;gap:8px}.player{display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}.dot{display:inline-block;width:22px;height:22px;border-radius:50%;flex:none;background:#202020}.dot.white{background:#fff;border:1px solid #aaa}.active{font-weight:800;color:#315942}.status{font-weight:700;margin:12px 0 6px}.small{font-size:13px;color:#6d7168}#board{display:block;width:100%;height:auto;background:#d8ad6d;border:1px solid #b78b4c;border-radius:12px;touch-action:manipulation}#message{min-height:22px;color:#a2442c;font-size:14px;margin:8px 0}#roomInfo{overflow-wrap:anywhere}button:focus-visible{outline:3px solid #e0a447;outline-offset:2px}details{font-size:13px;color:#60645e;margin-top:14px}a{color:#325a47} [hidden]{display:none!important}
</style></head><body><main><h1>오목 · 한 판</h1><p class="sub">열다섯 줄 위에서, 다섯 개의 돌을 먼저.</p><section class="panel"><h2>게임 선택</h2><div class="row"><button id="local">한 기기에서 2인 대전</button><button id="create">온라인 방 만들기</button></div><div class="row" style="margin-top:8px"><input id="name" maxlength="20" placeholder="닉네임 (선택)" aria-label="닉네임"><input id="code" maxlength="8" placeholder="방 번호" aria-label="방 번호"><button id="join" class="secondary">참가</button></div><div id="onlineInfo" class="small" style="margin-top:9px"></div><div id="message" role="alert"></div></section><section class="panel"><div class="players"><div class="player" id="p1"><span class="dot"></span><span id="blackName">흑돌</span></div><div class="player" id="p2"><span class="dot white"></span><span id="whiteName">백돌</span></div></div><div id="status" class="status" aria-live="polite"></div><div id="roomInfo" class="small"></div><svg id="board" viewBox="0 0 480 480" role="group" aria-label="15줄 오목판"></svg><div class="row" style="margin-top:12px"><button id="reset" class="secondary">재대결</button><button id="copy" class="secondary" hidden>초대 링크 복사</button><button id="leave" class="secondary" hidden>방 나가기</button><span id="count" class="small"></span></div><details><summary>게임 규칙</summary>흑돌부터 번갈아 돌을 놓습니다. 가로, 세로, 대각선으로 연속 5개 이상이면 승리합니다. 빈칸이 없으면 무승부입니다. 온라인 재대결은 두 플레이어가 모두 동의해야 시작됩니다.</details></section></main><script src="firebase-config.js"></script><script src="game.js"></script><script src="app.js"></script></body></html>
